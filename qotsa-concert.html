<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QOTSA — Concert Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

:root {
  --bg: #0e0c0a;
  --paper: #f5f0e8;
  --ink: #1a1410;
  --red: #b5282a;
  --red-dark: #8a1e20;
  --gold: #c8963a;
  --rust: #8b3a1a;
  --dim: #2a2420;
  --muted: #6a5a50;
  --sp: #1db954;
  --sp-dark: #158a3e;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  min-height: 100vh;
  font-family: 'Courier Prime', monospace;
  overflow-x: hidden;
}

/* ── Background texture ── */
body::before {
  content:'';
  position:fixed;
  inset:0;
  background:
    repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,.01) 2px, rgba(255,255,255,.01) 3px),
    repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(255,255,255,.005) 60px, rgba(255,255,255,.005) 61px);
  pointer-events:none;
  z-index:0;
}

/* ── Spotify panel ── */
.sp-bar {
  position: relative;
  z-index: 2;
  background: var(--dim);
  border-bottom: 1px solid #333;
  padding: .7rem 2rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.sp-bar-label {
  font-family: 'Oswald', sans-serif;
  font-size: .7rem;
  letter-spacing: .2em;
  color: var(--muted);
  text-transform: uppercase;
}

.sp-input {
  background: var(--bg);
  border: 1px solid #444;
  color: var(--paper);
  font-family: 'Courier Prime', monospace;
  font-size: .75rem;
  padding: .4rem .8rem;
  flex: 1;
  min-width: 180px;
  outline: none;
}

.sp-input:focus { border-color: var(--sp); }

.sp-connect-btn {
  background: var(--sp);
  border: none;
  color: #000;
  font-family: 'Oswald', sans-serif;
  font-size: .75rem;
  font-weight: 600;
  letter-spacing: .15em;
  padding: .4rem 1.2rem;
  cursor: pointer;
  text-transform: uppercase;
  transition: background .2s;
  white-space: nowrap;
}
.sp-connect-btn:hover { background: var(--sp-dark); }

.sp-connected-text { font-size: .7rem; color: var(--sp); letter-spacing: .1em; }
.sp-logout-btn {
  background: transparent;
  border: 1px solid #444;
  color: var(--muted);
  font-family: 'Courier Prime', monospace;
  font-size: .65rem;
  padding: .3rem .7rem;
  cursor: pointer;
  transition: all .2s;
}
.sp-logout-btn:hover { border-color: var(--red); color: var(--red); }

.sp-hint {
  width: 100%;
  font-size: .58rem;
  color: #444;
  letter-spacing: .06em;
}
.sp-hint code { color: var(--gold); }

/* ── Main layout ── */
main {
  position: relative;
  z-index: 1;
  max-width: 900px;
  margin: 0 auto;
  padding: 3rem 1.5rem 5rem;
}

/* ── Concert poster header ── */
.poster-header {
  text-align: center;
  margin-bottom: 3rem;
  position: relative;
}

.poster-header::before {
  content: '';
  display: block;
  height: 4px;
  background: var(--red);
  margin-bottom: 1.5rem;
}

.poster-header::after {
  content: '';
  display: block;
  height: 2px;
  background: var(--gold);
  margin-top: 1.5rem;
}

.poster-presents {
  font-family: 'Oswald', sans-serif;
  font-size: .75rem;
  letter-spacing: .5em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: .5rem;
}

.poster-band {
  font-family: 'Oswald', sans-serif;
  font-size: clamp(3.5rem, 10vw, 7rem);
  font-weight: 700;
  color: var(--paper);
  line-height: .85;
  letter-spacing: -.02em;
  text-transform: uppercase;
}

.poster-band span { color: var(--red); }

.poster-sub {
  font-family: 'Oswald', sans-serif;
  font-size: 1rem;
  letter-spacing: .4em;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: .8rem;
}

/* ── Controls ── */
.controls {
  display: flex;
  gap: .75rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 3rem;
  align-items: center;
}

.ctrl-label {
  font-family: 'Oswald', sans-serif;
  font-size: .7rem;
  letter-spacing: .2em;
  color: var(--muted);
  text-transform: uppercase;
}

.vibe-btn {
  background: transparent;
  border: 1px solid var(--dim);
  color: var(--muted);
  font-family: 'Oswald', sans-serif;
  font-size: .75rem;
  letter-spacing: .15em;
  padding: .45rem 1.1rem;
  cursor: pointer;
  text-transform: uppercase;
  transition: all .2s;
}
.vibe-btn:hover { border-color: var(--red); color: var(--paper); }
.vibe-btn.active { background: var(--red); border-color: var(--red); color: var(--paper); }

.gen-btn {
  background: var(--red);
  border: none;
  color: var(--paper);
  font-family: 'Oswald', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: .2em;
  padding: .65rem 2.5rem;
  cursor: pointer;
  text-transform: uppercase;
  transition: background .2s;
}
.gen-btn:hover { background: var(--red-dark); }

/* ── Concert ticket / setlist ── */
.setlist-wrap {
  display: none;
  animation: fadeUp .5s ease forwards;
}
.setlist-wrap.visible { display: block; }

@keyframes fadeUp {
  from { opacity:0; transform:translateY(20px); }
  to   { opacity:1; transform:translateY(0); }
}

/* Ticket stub top */
.ticket {
  background: var(--paper);
  color: var(--ink);
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}

.ticket-header {
  background: var(--ink);
  color: var(--paper);
  padding: 2rem 3rem 1.5rem;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2rem;
  align-items: start;
  border-bottom: 4px solid var(--red);
}

.ticket-band {
  font-family: 'Oswald', sans-serif;
  font-size: clamp(1.5rem, 4vw, 2.5rem);
  font-weight: 700;
  letter-spacing: -.01em;
  line-height: 1;
  color: var(--paper);
}

.ticket-concert-name {
  font-family: 'Oswald', sans-serif;
  font-size: clamp(1rem, 2.5vw, 1.4rem);
  font-weight: 300;
  color: var(--red);
  letter-spacing: .1em;
  text-transform: uppercase;
  margin-top: .3rem;
}

.ticket-meta {
  text-align: right;
  font-size: .65rem;
  letter-spacing: .1em;
  color: var(--muted);
  line-height: 2;
  text-transform: uppercase;
}

.ticket-meta strong { color: var(--paper); display: block; font-size: .8rem; }

/* Tear line */
.tear-line {
  border-top: 2px dashed #ccc;
  margin: 0 1.5rem;
  position: relative;
}
.tear-line::before, .tear-line::after {
  content: '';
  position: absolute;
  top: -10px;
  width: 20px; height: 20px;
  background: var(--bg);
  border-radius: 50%;
}
.tear-line::before { left: -2rem; }
.tear-line::after  { right: -2rem; }

/* Setlist body */
.setlist-body {
  padding: 2rem 3rem;
}

.setlist-section-title {
  font-family: 'Oswald', sans-serif;
  font-size: .7rem;
  letter-spacing: .4em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: .8rem;
  display: flex;
  align-items: center;
  gap: 1rem;
}
.setlist-section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #ddd;
}

.setlist-section { margin-bottom: 2rem; }

.setlist-track {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  align-items: baseline;
  gap: .8rem;
  padding: .55rem 0;
  border-bottom: 1px solid #e8e2d8;
  transition: background .1s;
}
.setlist-track:last-child { border-bottom: none; }
.setlist-track:hover { background: rgba(0,0,0,.03); margin: 0 -.5rem; padding: .55rem .5rem; }

.track-num {
  font-family: 'Oswald', sans-serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--red);
  opacity: .5;
  text-align: right;
  line-height: 1;
}

.track-name {
  font-family: 'Oswald', sans-serif;
  font-size: 1.05rem;
  font-weight: 500;
  color: var(--ink);
  line-height: 1;
}

.track-album {
  font-size: .6rem;
  color: var(--muted);
  letter-spacing: .05em;
  margin-top: .15rem;
}

.track-duration {
  font-size: .7rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Encore star */
.encore-marker {
  text-align: center;
  padding: .8rem 0;
  font-family: 'Oswald', sans-serif;
  font-size: .65rem;
  letter-spacing: .5em;
  color: var(--red);
  text-transform: uppercase;
}

/* Ticket footer */
.ticket-footer {
  background: var(--ink);
  padding: 1.5rem 3rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
  border-top: 4px solid var(--gold);
}

.footer-total {
  font-family: 'Oswald', sans-serif;
}

.footer-total-label {
  font-size: .6rem;
  letter-spacing: .2em;
  color: var(--muted);
  text-transform: uppercase;
}

.footer-total-val {
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--paper);
}

.sp-add-btn {
  display: none;
  align-items: center;
  gap: .5rem;
  background: var(--sp);
  border: none;
  color: #000;
  font-family: 'Oswald', sans-serif;
  font-size: .8rem;
  font-weight: 600;
  letter-spacing: .15em;
  padding: .6rem 1.5rem;
  cursor: pointer;
  text-transform: uppercase;
  transition: background .2s;
}
.sp-add-btn.show { display: flex; }
.sp-add-btn:hover { background: var(--sp-dark); }
.sp-add-btn:disabled { opacity: .5; cursor: not-allowed; }

.sp-feedback {
  font-size: .65rem;
  padding: .5rem .8rem;
  border: 1px solid transparent;
  display: none;
  margin-top: .5rem;
}
.sp-feedback.show { display: block; }
.sp-feedback.ok  { border-color: var(--sp); color: var(--sp); background: rgba(29,185,84,.08); }
.sp-feedback.err { border-color: var(--red); color: var(--red); background: rgba(181,40,42,.08); }
.sp-feedback a   { color: inherit; }

.shuffle-note {
  font-size: .58rem;
  color: var(--dim);
  text-align: right;
  margin-top: 1.5rem;
  letter-spacing: .1em;
  text-transform: uppercase;
}

@media (max-width: 600px) {
  .ticket-header, .setlist-body, .ticket-footer { padding-left: 1.5rem; padding-right: 1.5rem; }
  .ticket-header { grid-template-columns: 1fr; }
  .ticket-meta { text-align: left; }
  .tear-line::before, .tear-line::after { display: none; }
}
</style>
</head>

<!-- Spotify bar -->
<div class="sp-bar" id="spBar">

<script>
// ── Spotify PKCE ─────────────────────────────────────────────────────────
const SP = (() => {
  const P = 'qc_';
  const k = n => P+n;
  const SCOPES = 'playlist-modify-public playlist-modify-private';

  async function rand32() {
    const a=new Uint8Array(32);crypto.getRandomValues(a);
    return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  }
  async function sha256(s) {
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  }
  function redirectUri() { return window.location.origin+window.location.pathname; }

  async function login(cid) {
    localStorage.setItem(k('cid'),cid);
    const v=await rand32(); localStorage.setItem(k('v'),v);
    const ch=await sha256(v);
    const p=new URLSearchParams({client_id:cid,response_type:'code',redirect_uri:redirectUri(),
      scope:SCOPES,code_challenge_method:'S256',code_challenge:ch});
    window.location='https://accounts.spotify.com/authorize?'+p;
  }
  async function _save(r) {
    const d=await r.json();
    if(!r.ok) throw new Error(d.error_description||d.error||`HTTP ${r.status}`);
    localStorage.setItem(k('token'),d.access_token);
    localStorage.setItem(k('exp'),Date.now()+(d.expires_in-60)*1000);
    if(d.refresh_token) localStorage.setItem(k('refresh'),d.refresh_token);
  }
  async function _exchange(code) {
    await _save(await fetch('https://accounts.spotify.com/api/token',{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:redirectUri(),
        client_id:localStorage.getItem(k('cid')),code_verifier:localStorage.getItem(k('v'))})
    }));
  }
  async function _refresh() {
    const rt=localStorage.getItem(k('refresh'));
    if(!rt) throw new Error('Sessie verlopen — log opnieuw in.');
    await _save(await fetch('https://accounts.spotify.com/api/token',{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({grant_type:'refresh_token',refresh_token:rt,client_id:localStorage.getItem(k('cid'))})
    }));
  }
  async function token() {
    const t=localStorage.getItem(k('token')),e=parseInt(localStorage.getItem(k('exp'))||'0');
    if(t&&Date.now()<e) return t;
    await _refresh(); return localStorage.getItem(k('token'));
  }
  async function api(ep,opts={},attempt=0) {
    const tk=await token();
    const r=await fetch('https://api.spotify.com/v1'+ep,{...opts,
      headers:{'Authorization':'Bearer '+tk,'Content-Type':'application/json',...(opts.headers||{})}});
    if(r.status===429){
      if(attempt>=4) throw new Error('Rate limit — probeer later opnieuw.');
      await new Promise(res=>setTimeout(res,parseInt(r.headers.get('Retry-After')||'1')*1000*Math.pow(2,attempt)));
      return api(ep,opts,attempt+1);
    }
    if(r.status===204) return {};
    const d=await r.json();
    if(!r.ok){
      const msg=d?.error?.message||`HTTP ${r.status}`;
      if(r.status===401) throw new Error('Sessie verlopen — log opnieuw in.');
      if(r.status===403) throw new Error('Toegang geweigerd: '+msg);
      throw new Error(`Spotify fout ${r.status}: ${msg}`);
    }
    return d;
  }
  async function handleCallback() {
    const p=new URLSearchParams(location.search);
    if(p.get('error')) throw new Error('Login geweigerd: '+p.get('error'));
    if(!p.get('code')) return false;
    await _exchange(p.get('code'));
    history.replaceState({},'',location.pathname);
    return true;
  }
  function logout() { ['token','exp','refresh','v'].forEach(n=>localStorage.removeItem(k(n))); }
  const isConnected=()=>!!localStorage.getItem(k('token'));
  const clientId=()=>localStorage.getItem(k('cid'))||'';

  async function searchTrack(title,artist) {
    const q=encodeURIComponent(`track:${title} artist:${artist}`);
    const d=await api(`/search?q=${q}&type=track&limit=1`);
    return d.tracks?.items?.[0]?.uri??null;
  }
  async function createPlaylist(name,desc) {
    return api('/me/playlists',{method:'POST',body:JSON.stringify({name,description:desc,public:false})});
  }
  async function addItems(plId,uris) {
    for(let i=0;i<uris.length;i+=100)
      await api(`/playlists/${plId}/items`,{method:'POST',body:JSON.stringify({uris:uris.slice(i,i+100)})});
  }
  return {login,handleCallback,logout,isConnected,clientId,redirectUri,api,searchTrack,createPlaylist,addItems};
})();

// ── UI ────────────────────────────────────────────────────────────────────
document.querySelectorAll('.vibe-btn').forEach(b=>
  b.addEventListener('click',()=>{
    document.querySelectorAll('.vibe-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  })
);

function updateSpUI() {
  const ok=SP.isConnected();
  document.getElementById('spLoginArea').style.display=ok?'none':'flex';
  document.getElementById('spConnectedArea').style.display=ok?'flex':'none';
  const hint=document.getElementById('spHint');
  hint.innerHTML=ok?'':
    `Redirect URI voor Spotify Dashboard: <code>${SP.redirectUri()}</code>`;
  const btn=document.getElementById('spAddBtn');
  if(btn) btn.classList.toggle('show',ok);
}

function doLogin() {
  const cid=document.getElementById('cidInput').value.trim();
  if(!cid){alert('Vul je Client ID in.');return;}
  SP.login(cid).catch(e=>alert(e.message));
}
function doLogout(){SP.logout();updateSpUI();}

const lastIdx={};

function generateSetlist() {
  const vibe=document.querySelector('.vibe-btn.active').dataset.vibe;
  const pool=SETLISTS[vibe];
  let idx=Math.floor(Math.random()*pool.length);
  if(pool.length>1&&idx===(lastIdx[vibe]??-1)) idx=(idx+1)%pool.length;
  lastIdx[vibe]=idx;
  renderSetlist(pool[idx]);
}

function renderSetlist(set) {
  window.__currentSet__=set;
  const allTracks=set.sections.flatMap(s=>s.tracks);
  const totalSecs=allTracks.reduce((a,t)=>{
    const [m,s]=(t.duration||'4:00').split(':').map(Number);
    return a+m*60+(s||0);
  },0);
  const totalMins=Math.floor(totalSecs/60);

  let num=0;
  const sectionsHtml=set.sections.map(sec=>`
    ${sec.encore?'<div class="encore-marker">— ✦ ENCORE ✦ —</div>':''}
    <div class="setlist-section">
      <div class="setlist-section-title">${sec.title}</div>
      ${sec.tracks.map(t=>{
        num++;
        return `<div class="setlist-track">
          <div class="track-num">${num}</div>
          <div>
            <div class="track-name">${esc(t.title)}</div>
            <div class="track-album">${esc(t.album)}</div>
          </div>
          <div class="track-duration">${t.duration}</div>
        </div>`;
      }).join('')}
    </div>`).join('');

  const spBtn=SP.isConnected()
    ?'<button class="sp-add-btn show" id="spAddBtn" onclick="addToSpotify()">▶ Zet op Spotify</button>'
    :'<button class="sp-add-btn" id="spAddBtn" onclick="addToSpotify()">▶ Zet op Spotify</button>';

  const wrap=document.getElementById('setlistWrap');
  wrap.innerHTML=`
    <div class="ticket">
      <div class="ticket-header">
        <div>
          <div class="ticket-band">Queens of the Stone Age</div>
          <div class="ticket-concert-name">${esc(set.name)}</div>
        </div>
        <div class="ticket-meta">
          <strong>${esc(set.venue)}</strong>
          ${esc(set.date)}<br>
          ${allTracks.length} nummers · ${totalMins} min
        </div>
      </div>
      <div class="tear-line"></div>
      <div class="setlist-body">${sectionsHtml}</div>
      <div class="ticket-footer">
        <div class="footer-total">
          <div class="footer-total-label">Totale speeltijd</div>
          <div class="footer-total-val">${totalMins} minuten</div>
        </div>
        <div>
          ${spBtn}
          <div class="sp-feedback" id="spFeedback"></div>
        </div>
      </div>
    </div>
    <div class="shuffle-note">Klik opnieuw voor een andere setlist</div>`;

  wrap.classList.remove('visible');
  void wrap.offsetWidth;
  wrap.classList.add('visible');
  wrap.scrollIntoView({behavior:'smooth',block:'start'});
}

async function addToSpotify() {
  const btn=document.getElementById('spAddBtn');
  const fb=document.getElementById('spFeedback');
  btn.disabled=true; btn.textContent='Bezig…';
  fb.className='sp-feedback'; fb.style.display='none';
  try {
    const set=window.__currentSet__;
    const tracks=set.sections.flatMap(s=>s.tracks);
    const pl=await SP.createPlaylist(
      'QOTSA — '+set.name,
      'Setlist gegenereerd via QOTSA Concert Generator'
    );
    const uris=[];
    for(const t of tracks){
      const uri=await SP.searchTrack(t.title,'Queens of the Stone Age');
      if(uri) uris.push(uri);
    }
    await SP.addItems(pl.id,uris);
    const url=pl.external_urls?.spotify||'#';
    fb.innerHTML=`✓ Setlist aangemaakt! ${uris.length}/${tracks.length} nummers gevonden. `
      +`<a href="${url}" target="_blank" rel="noopener">Open in Spotify ↗</a>`;
    fb.className='sp-feedback show ok';
  } catch(e) {
    fb.textContent='✗ '+e.message;
    fb.className='sp-feedback show err';
  }
  btn.disabled=false; btn.textContent='▶ Zet op Spotify';
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

(async()=>{
  const cid=SP.clientId();
  if(cid) document.getElementById('cidInput').value=cid;
  try{await SP.handleCallback();}catch(e){alert(e.message);}
  updateSpUI();
})();
</script>
