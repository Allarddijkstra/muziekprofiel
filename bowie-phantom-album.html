<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>David Bowie — The Phantom Album</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap');
  :root{
    --ivory:#f0ead8;--gold:#c9a84c;--electric:#4a90d9;
    --deep:#080610;--ink:#111020;--layer:#1a1828;
    --groove:#2a2840;--muted:#7a7898;--accent:#e85d9a;
    --sp:#1db954;--sp-dark:#158a3e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--deep);color:var(--ivory);font-family:'DM Mono',monospace;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background:
    radial-gradient(1px 1px at 10% 15%,rgba(255,255,255,.15) 0%,transparent 100%),
    radial-gradient(1px 1px at 30% 40%,rgba(255,255,255,.1) 0%,transparent 100%),
    radial-gradient(1px 1px at 55% 8%,rgba(255,255,255,.12) 0%,transparent 100%),
    radial-gradient(1px 1px at 80% 65%,rgba(255,255,255,.08) 0%,transparent 100%);
    pointer-events:none;z-index:0;}
  header{border-bottom:1px solid var(--groove);padding:3rem 4rem 2.5rem;position:relative;overflow:hidden;z-index:1;}
  header::before{content:'';position:absolute;top:-60px;right:-80px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(74,144,217,.08),transparent 70%);pointer-events:none;}
  header::after{content:'BOWIE';position:absolute;right:-5px;top:0;font-family:'Playfair Display',serif;font-size:180px;font-weight:900;color:rgba(201,168,76,.04);pointer-events:none;line-height:1;}
  .band-label{font-size:.6rem;letter-spacing:.35em;color:var(--gold);text-transform:uppercase;margin-bottom:.6rem;}
  h1{font-family:'Playfair Display',serif;font-size:clamp(3rem,8vw,6.5rem);font-weight:900;line-height:.88;letter-spacing:-.02em;}
  h1 em{font-style:italic;color:var(--gold);}
  .subtitle{margin-top:1rem;font-size:.68rem;color:var(--muted);letter-spacing:.1em;max-width:480px;line-height:2;}
  main{max-width:1100px;margin:0 auto;padding:2.5rem 2rem;position:relative;z-index:1;}

  /* ── Spotify Panel ── */
  .sp-panel{background:var(--ink);border:1px solid var(--groove);border-left:3px solid var(--groove);padding:1.2rem 1.5rem;margin-bottom:2.5rem;transition:border-color .3s;}
  .sp-panel.connected{border-left-color:var(--sp);}
  .sp-panel.warning{border-left-color:var(--accent);}
  .sp-row{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
  .sp-label{font-size:.6rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;white-space:nowrap;flex-shrink:0;}
  .sp-input{background:var(--layer);border:1px solid var(--groove);color:var(--ivory);font-family:'DM Mono',monospace;font-size:.68rem;padding:.45rem .85rem;flex:1;min-width:160px;letter-spacing:.04em;}
  .sp-input:focus{outline:none;border-color:var(--gold);}
  .sp-btn{background:var(--sp);border:none;color:#000;font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.14em;padding:.45rem 1.1rem;cursor:pointer;text-transform:uppercase;font-weight:700;white-space:nowrap;transition:background .2s;}
  .sp-btn:hover{background:var(--sp-dark);}
  .sp-btn:disabled{opacity:.45;cursor:not-allowed;}
  .sp-btn.ghost{background:transparent;border:1px solid var(--sp);color:var(--sp);font-weight:400;}
  .sp-btn.ghost:hover{background:rgba(29,185,84,.1);}
  .sp-status.ok{color:var(--sp);font-size:.62rem;letter-spacing:.12em;}
  .sp-hint{font-size:.56rem;color:var(--muted);margin-top:.5rem;line-height:1.6;}
  .sp-hint code{color:var(--electric);font-family:'DM Mono',monospace;}

  /* ── Controls ── */
  .controls{display:flex;gap:.75rem;align-items:center;margin-bottom:3rem;flex-wrap:wrap;}
  .vibe-label{font-size:.6rem;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;}
  .vibe-btn{background:transparent;border:1px solid var(--groove);color:var(--muted);font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.12em;padding:.5rem 1.1rem;cursor:pointer;text-transform:uppercase;transition:all .2s;}
  .vibe-btn:hover{border-color:var(--gold);color:var(--gold);}
  .vibe-btn.active{background:var(--gold);border-color:var(--gold);color:var(--deep);}
  .gen-btn{background:transparent;border:1px solid var(--electric);color:var(--electric);font-family:'Playfair Display',serif;font-size:.9rem;font-style:italic;letter-spacing:.1em;padding:.6rem 1.8rem;cursor:pointer;transition:all .25s;margin-left:auto;}
  .gen-btn:hover{background:var(--electric);color:var(--deep);}

  /* ── Album ── */
  .album-container{display:none;}
  .album-container.visible{display:block;animation:fadeUp .6s ease forwards;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  .album-header{display:grid;grid-template-columns:280px 1fr;gap:3.5rem;margin-bottom:3rem;align-items:start;}
  .album-cover{width:280px;height:280px;background:var(--ink);border:1px solid var(--groove);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0;}
  .album-cover::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(74,144,217,.12),transparent 60%),radial-gradient(circle at 70% 70%,rgba(232,93,154,.08),transparent 60%);}
  .album-cover::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 22px,rgba(201,168,76,.025) 22px,rgba(201,168,76,.025) 23px);}
  .cover-inner{position:relative;z-index:2;text-align:center;padding:1.5rem;}
  .cover-icon{font-size:3.5rem;line-height:1;margin-bottom:.8rem;display:block;}
  .cover-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--ivory);line-height:1.2;}
  .cover-artist{font-size:.5rem;letter-spacing:.35em;color:var(--gold);margin-top:.4rem;text-transform:uppercase;}
  .album-meta h2{font-family:'Playfair Display',serif;font-size:clamp(2rem,4vw,3.5rem);font-weight:900;line-height:.9;letter-spacing:-.02em;margin-bottom:.6rem;}
  .album-meta h2 em{font-style:italic;color:var(--gold);}
  .album-tagline{font-size:.6rem;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:1.5rem;}
  .album-concept{font-size:.72rem;line-height:1.95;border-left:2px solid var(--gold);padding-left:1.1rem;color:var(--ivory);max-width:480px;}
  .album-stats{display:flex;gap:2rem;margin-top:1.5rem;flex-wrap:wrap;}
  .stat-val{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:var(--electric);line-height:1;display:block;}
  .stat-label{font-size:.5rem;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;}

  .sp-action{margin-top:1.2rem;display:flex;flex-direction:column;gap:.5rem;align-items:flex-start;}
  .sp-add-btn{display:none;align-items:center;gap:.5rem;background:var(--sp);border:none;color:#000;font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:.12em;padding:.55rem 1.2rem;cursor:pointer;text-transform:uppercase;font-weight:700;transition:background .2s;}
  .sp-add-btn.show{display:flex;}
  .sp-add-btn:hover{background:var(--sp-dark);}
  .sp-add-btn:disabled{opacity:.45;cursor:not-allowed;}
  .sp-feedback{font-size:.63rem;padding:.5rem .8rem;border:1px solid transparent;display:none;}
  .sp-feedback.show{display:block;}
  .sp-feedback.ok{border-color:var(--sp);color:var(--sp);}
  .sp-feedback.err{border-color:var(--accent);color:var(--accent);}
  .sp-feedback a{color:inherit;}
  .sp-attribution{font-size:.52rem;display:block;margin-top:.2rem;}
  .sp-attribution a{color:var(--sp);text-decoration:none;}

  .tracklist-header{display:flex;align-items:center;gap:1rem;margin-bottom:.5rem;border-top:1px solid var(--groove);padding-top:2.5rem;}
  .tracklist-header h3{font-family:'Playfair Display',serif;font-size:1rem;font-style:italic;letter-spacing:.08em;color:var(--gold);white-space:nowrap;}
  .tracklist-header .line{flex:1;height:1px;background:var(--groove);}
  .side-label{font-size:.6rem;letter-spacing:.3em;color:var(--electric);margin:1.8rem 0 .3rem;text-transform:uppercase;display:flex;align-items:center;gap:1rem;}
  .side-label::after{content:'';flex:1;height:1px;background:var(--electric);opacity:.2;}
  .track{display:grid;grid-template-columns:38px 1fr auto;gap:1rem;align-items:start;padding:1.1rem .5rem;border-bottom:1px solid rgba(42,40,64,.8);transition:background .15s;}
  .track:hover{background:rgba(74,144,217,.04);}
  .track-num{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--gold);opacity:.35;line-height:1;padding-top:3px;}
  .track-title{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:700;color:var(--ivory);line-height:1.1;margin-bottom:.2rem;}
  .track-from{font-size:.55rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-bottom:.3rem;}
  .track-why{font-size:.64rem;color:rgba(240,234,216,.5);line-height:1.8;font-style:italic;}
  .track-duration{font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px;white-space:nowrap;}
  .producer-notes{margin-top:2.5rem;background:var(--ink);border:1px solid var(--groove);border-left:3px solid var(--accent);padding:1.8rem 2rem;}
  .producer-notes h4{font-family:'Playfair Display',serif;font-size:.9rem;font-style:italic;letter-spacing:.1em;color:var(--accent);margin-bottom:.8rem;}
  .producer-notes p{font-size:.68rem;line-height:2;color:var(--ivory);font-style:italic;}
  .shuffle-note{font-size:.55rem;color:var(--groove);letter-spacing:.12em;text-align:right;margin-top:1.5rem;text-transform:uppercase;}

  @media(max-width:640px){
    header{padding:2rem 1.5rem;}main{padding:2rem 1rem;}
    .album-header{grid-template-columns:1fr;}.album-cover{width:100%;height:220px;}
    .controls{gap:.5rem;}.gen-btn{margin-left:0;width:100%;}
  }
</style>
</head>
<body>
<header>
  <div class="band-label">David Bowie · Phantomalbum Generator</div>
  <h1>THE <em>PHANTOM</em><br>ALBUM</h1>
  <p class="subtitle">Twintig studioalbums. Vijftig jaar metamorfose. Van Ziggy tot Blackstar — alles ligt op de band. Kies een sfeer, de machine maakt de keuze.</p>
</header>
<main>

  <div class="sp-panel" id="spPanel">
    <div class="sp-row" id="spLoginRow">
      <span class="sp-label">Spotify</span>
      <input class="sp-input" id="cidInput" placeholder="Plak je Spotify Client ID hier…" />
      <button class="sp-btn" onclick="doLogin()">Verbinden</button>
    </div>
    <div id="spConnectedRow" style="display:none">
      <div class="sp-row">
        <span class="sp-label">Spotify</span>
        <span class="sp-status ok" id="spStatusText">✓ Verbonden</span>
        <button class="sp-btn ghost" onclick="doLogout()">Uitloggen</button>
      </div>
    </div>
    <div class="sp-hint" id="spHint"></div>
  </div>

  <div class="controls">
    <span class="vibe-label">Sfeer:</span>
    <button class="vibe-btn active" data-vibe="glam">Glam &amp; Theater</button>
    <button class="vibe-btn" data-vibe="berlin">Berlijn &amp; Avant-garde</button>
    <button class="vibe-btn" data-vibe="soul">Soul &amp; Groove</button>
    <button class="vibe-btn" data-vibe="dark">Duister &amp; Einde</button>
    <button class="gen-btn" onclick="generateAlbum()">&#9654; Stel album samen</button>
  </div>

  <div class="album-container" id="albumContainer"></div>
</main>

<script>
// ═══════════════════════════════════════════════════════════════════════════
// Spotify PKCE Client (compliant: PKCE flow, /items endpoint, token refresh,
//                      exponential backoff + Retry-After, full error handling)
// ═══════════════════════════════════════════════════════════════════════════
const SP = (() => {
  const PFX = 'bw_';
  const k = n => PFX + n;
  const SCOPES = 'playlist-modify-public playlist-modify-private';

  function redirectUri() {
    const uri = window.location.origin + window.location.pathname;
    if (location.protocol !== 'https:' && !/^127\.0\.0\.1/.test(location.hostname))
      console.warn('[Spotify] Redirect URI moet HTTPS zijn voor productie.');
    return uri;
  }

  async function rand32() {
    const a = new Uint8Array(32); crypto.getRandomValues(a);
    return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  }
  async function sha256b64url(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  }

  async function login(clientId) {
    localStorage.setItem(k('cid'), clientId);
    const v = await rand32();
    localStorage.setItem(k('v'), v);
    const challenge = await sha256b64url(v);
    const params = new URLSearchParams({
      client_id: clientId, response_type: 'code',
      redirect_uri: redirectUri(), scope: SCOPES,
      code_challenge_method: 'S256', code_challenge: challenge
    });
    window.location = 'https://accounts.spotify.com/authorize?' + params;
  }

  async function _saveTokens(r) {
    const d = await r.json();
    if (!r.ok) throw new Error(d.error_description || d.error || `HTTP ${r.status}`);
    localStorage.setItem(k('token'), d.access_token);
    localStorage.setItem(k('exp'),   Date.now() + (d.expires_in - 60) * 1000);
    if (d.refresh_token) localStorage.setItem(k('refresh'), d.refresh_token);
  }

  async function _exchange(code) {
    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({ grant_type:'authorization_code', code,
        redirect_uri: redirectUri(), client_id: localStorage.getItem(k('cid')),
        code_verifier: localStorage.getItem(k('v')) })
    });
    await _saveTokens(r);
  }

  async function _refresh() {
    const rt = localStorage.getItem(k('refresh'));
    if (!rt) throw new Error('Sessie verlopen. Log opnieuw in.');
    const r = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({ grant_type:'refresh_token', refresh_token: rt,
        client_id: localStorage.getItem(k('cid')) })
    });
    await _saveTokens(r);
  }

  async function _token() {
    const t = localStorage.getItem(k('token'));
    const e = parseInt(localStorage.getItem(k('exp')) || '0');
    if (t && Date.now() < e) return t;
    await _refresh();
    return localStorage.getItem(k('token'));
  }

  async function api(endpoint, opts = {}, attempt = 0) {
    const token = await _token();
    const res = await fetch('https://api.spotify.com/v1' + endpoint, {
      ...opts,
      headers: { 'Authorization': 'Bearer ' + token,
                 'Content-Type': 'application/json', ...(opts.headers||{}) }
    });

    if (res.status === 429) {
      if (attempt >= 4) throw new Error('Spotify rate limit — probeer het later opnieuw.');
      const retryAfter = parseInt(res.headers.get('Retry-After') || '1');
      await new Promise(r => setTimeout(r, retryAfter * 1000 * Math.pow(2, attempt)));
      return api(endpoint, opts, attempt + 1);
    }

    if (res.status === 204) return {};
    const data = await res.json();
    if (!res.ok) {
      const msg = data?.error?.message || `HTTP ${res.status}`;
      if (res.status === 401) throw new Error('Sessie verlopen — log opnieuw in. (' + msg + ')');
      if (res.status === 403) throw new Error('Toegang geweigerd — controleer je app-scopes. (' + msg + ')');
      if (res.status === 404) throw new Error('Niet gevonden: ' + msg);
      throw new Error(`Spotify fout ${res.status}: ${msg}`);
    }
    return data;
  }

  async function handleCallback() {
    const p = new URLSearchParams(location.search);
    if (p.get('error')) throw new Error('Login geweigerd: ' + p.get('error'));
    if (!p.get('code')) return false;
    await _exchange(p.get('code'));
    history.replaceState({}, '', location.pathname);
    return true;
  }

  function logout() {
    ['token','exp','refresh','v'].forEach(n => localStorage.removeItem(k(n)));
  }

  const isConnected  = () => !!localStorage.getItem(k('token'));
  const clientId     = () => localStorage.getItem(k('cid')) || '';
  const getRedirectUri = redirectUri;

  async function searchTrack(title, artist) {
    const q = encodeURIComponent(`track:${title} artist:${artist}`);
    const d = await api(`/search?q=${q}&type=track&limit=1`);
    return d.tracks?.items?.[0]?.uri ?? null;
  }

  async function createPlaylist(name, description) {
    const me = await api('/me');
    // POST /me/playlists — /users/{id}/playlists verwijderd feb 2026
    return api('/me/playlists', {
      method: 'POST',
      body: JSON.stringify({ name, description, public: false })
    });
  }

  // /playlists/{id}/items — niet de deprecated /tracks endpoint
  async function addItems(playlistId, uris) {
    for (let i = 0; i < uris.length; i += 100) {
      await api(`/playlists/${playlistId}/items`, {
        method: 'POST',
        body: JSON.stringify({ uris: uris.slice(i, i + 100) })
      });
    }
  }

  return { login, handleCallback, logout, isConnected, clientId,
           getRedirectUri, searchTrack, createPlaylist, addItems };
})();

// ═══════════════════════════════════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════════════════════════════════
function updateSpotifyUI() {
  const ok = SP.isConnected();
  document.getElementById('spLoginRow').style.display     = ok ? 'none' : '';
  document.getElementById('spConnectedRow').style.display = ok ? '' : 'none';
  document.getElementById('spPanel').className = 'sp-panel' + (ok ? ' connected' : '');
  const hint = document.getElementById('spHint');
  if (!ok) {
    const uri = SP.getRedirectUri();
    const secure = location.protocol === 'https:' || /^127\.0\.0\.1/.test(location.hostname);
    hint.innerHTML = `Redirect URI voor Spotify Dashboard: <code>${uri}</code>`
      + (!secure ? '<br><span style="color:var(--accent)">⚠ Gebruik HTTPS voor productie.</span>' : '');
    if (!secure) document.getElementById('spPanel').classList.add('warning');
  } else { hint.textContent = ''; }
  const btn = document.getElementById('spAddBtn');
  if (btn) btn.classList.toggle('show', ok);
}

function doLogin() {
  const cid = document.getElementById('cidInput').value.trim();
  if (!cid) { alert('Vul je Spotify Client ID in.'); return; }
  SP.login(cid).catch(e => alert(e.message));
}

function doLogout() { SP.logout(); updateSpotifyUI(); }

async function doAddToSpotify() {
  const btn = document.getElementById('spAddBtn');
  const fb  = document.getElementById('spFeedback');
  btn.disabled = true; btn.textContent = 'Bezig…';
  fb.className = 'sp-feedback'; fb.style.display = 'none';
  try {
    const { tracks, albumTitle } = window.__album__;
    const pl = await SP.createPlaylist(
      'Bowie — ' + albumTitle,
      'Phantom Album samengesteld via The Phantom Album App'
    );
    const uris = [];
    for (const t of tracks) {
      const uri = await SP.searchTrack(t.title, 'David Bowie');
      if (uri) uris.push(uri);
    }
    await SP.addItems(pl.id, uris);
    const url = pl.external_urls?.spotify || '#';
    fb.innerHTML = `✓ Playlist aangemaakt! ${uris.length}/${tracks.length} nummers gevonden. `
      + `<a href="${url}" target="_blank" rel="noopener">Open in Spotify ↗</a>`
      + `<span class="sp-attribution">Muziekdata door <a href="https://www.spotify.com" target="_blank" rel="noopener">Spotify</a></span>`;
    fb.className = 'sp-feedback show ok';
  } catch(e) {
    fb.textContent = '✗ ' + e.message;
    fb.className   = 'sp-feedback show err';
  }
  btn.disabled = false; btn.textContent = '▶ Toevoegen aan Spotify';
}

// ═══════════════════════════════════════════════════════════════════════════
// Album data
// ═══════════════════════════════════════════════════════════════════════════

     tracks:[

// Render
// ═══════════════════════════════════════════════════════════════════════════
const lastIdx = {};

document.querySelectorAll('.vibe-btn').forEach(b =>
  b.addEventListener('click', () => {
    document.querySelectorAll('.vibe-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  })
);

function generateAlbum() {
  const vibe = document.querySelector('.vibe-btn.active').dataset.vibe;
  const pool = ALBUMS[vibe];
  let idx = Math.floor(Math.random() * pool.length);
  if (pool.length > 1 && idx === (lastIdx[vibe] ?? -1)) idx = (idx + 1) % pool.length;
  lastIdx[vibe] = idx;
  renderAlbum(pool[idx]);
}

function renderAlbum(album) {
  window.__album__ = album;
  const c = document.getElementById('albumContainer');
  const totalMins = Math.floor(album.tracks.reduce((a,t) => {
    const [m,s] = (t.duration||'4:00').split(':').map(Number);
    return a + m*60 + (s||0);
  }, 0) / 60);

  const tr = (t, i) =>
    `<div class="track">
      <div class="track-num">${String(i+1).padStart(2,'0')}</div>
      <div>
        <div class="track-title">${t.title}</div>
        <div class="track-from">van: ${t.album}</div>
        <div class="track-why">${t.why}</div>
      </div>
      <div class="track-duration">${t.duration}</div>
    </div>`;

  const showSp = SP.isConnected() ? 'show' : '';

  c.innerHTML = `
    <div class="album-header">
      <div class="album-cover">
        <div class="cover-inner">
          <span class="cover-icon">${album.icon}</span>
          <div class="cover-title">${album.albumTitle}</div>
          <div class="cover-artist">David Bowie</div>
        </div>
      </div>
      <div class="album-meta">
        <h2>David<br>Bowie<br><em>${album.albumTitle}</em></h2>
        <div class="album-tagline">${album.tagline}</div>
        <div class="album-concept">${album.concept}</div>
        <div class="album-stats">
          <div><span class="stat-val">${album.tracks.length}</span><span class="stat-label">Tracks</span></div>
          <div><span class="stat-val">${totalMins}'</span><span class="stat-label">Speeltijd</span></div>
          <div><span class="stat-val">20</span><span class="stat-label">Albums</span></div>
        </div>
        <div class="sp-action">
          <button class="sp-add-btn ${showSp}" id="spAddBtn" onclick="doAddToSpotify()">▶ Toevoegen aan Spotify</button>
          <div class="sp-feedback" id="spFeedback"></div>
        </div>
      </div>
    </div>
    <div class="tracklist-header"><h3>Tracklist</h3><div class="line"></div></div>
    <div class="side-label">Side A</div>
    ${album.tracks.slice(0,6).map((t,i) => tr(t,i)).join('')}
    <div class="side-label">Side B</div>
    ${album.tracks.slice(6).map((t,i) => tr(t,i+6)).join('')}
    <div class="producer-notes">
      <h4>// Producersnotitie</h4>
      <p>${album.producerNote}</p>
    </div>
    <div class="shuffle-note">Klik opnieuw voor een andere versie binnen deze sfeer</div>`;

  c.classList.remove('visible');
  void c.offsetWidth;
  c.classList.add('visible');
  c.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Init

(async () => {
  const stored = SP.clientId();
  if (stored) document.getElementById('cidInput').value = stored;
  try { await SP.handleCallback(); } catch(e) { alert(e.message); }
  updateSpotifyUI();
})();
</script>
