<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiohead — Concert Generator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,700;0,900;1,300&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');
:root{
  --bg:#f4f2ee;--dark:#0d0d0d;--ink:#1a1a1a;
  --blue:#1a3a8a;--blue-light:#2a52c4;
  --grey:#888880;--border:#d0ccc4;--surface:#eceae4;
  --sp:#1db954;--sp-dark:#158a3e;--red:#c0392b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);min-height:100vh;font-family:'Courier Prime',monospace;color:var(--ink);overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(0,0,0,.05) 1px,transparent 1px);background-size:24px 24px;pointer-events:none;z-index:0;}

/* Spotify bar */
.sp-bar{position:relative;z-index:2;background:var(--dark);padding:.7rem 2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
.sp-bar-label{font-family:'Montserrat',sans-serif;font-size:.65rem;letter-spacing:.2em;color:var(--grey);text-transform:uppercase;}
.sp-input{background:#1a1a1a;border:1px solid #333;color:#eee;font-family:'Courier Prime',monospace;font-size:.75rem;padding:.4rem .8rem;flex:1;min-width:180px;outline:none;}
.sp-input:focus{border-color:var(--sp);}
.sp-connect-btn{background:var(--sp);border:none;color:#000;font-family:'Montserrat',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.15em;padding:.4rem 1.2rem;cursor:pointer;text-transform:uppercase;transition:background .2s;white-space:nowrap;}
.sp-connect-btn:hover{background:var(--sp-dark);}
.sp-connected-text{font-size:.7rem;color:var(--sp);}
.sp-logout-btn{background:transparent;border:1px solid #333;color:var(--grey);font-family:'Courier Prime',monospace;font-size:.65rem;padding:.3rem .7rem;cursor:pointer;transition:all .2s;}
.sp-logout-btn:hover{border-color:var(--red);color:var(--red);}
.sp-hint{width:100%;font-size:.58rem;color:#444;}
.sp-hint code{color:var(--sp);}

/* Main */
main{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:3rem 1.5rem 5rem;}

/* Header */
.poster-header{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:end;margin-bottom:2.5rem;padding-bottom:2rem;border-bottom:3px solid var(--ink);}
.poster-tag{font-family:'Montserrat',sans-serif;font-size:.65rem;letter-spacing:.4em;color:var(--blue);text-transform:uppercase;margin-bottom:.5rem;}
.poster-band{font-family:'Montserrat',sans-serif;font-size:clamp(2.5rem,8vw,5.5rem);font-weight:900;line-height:.88;color:var(--ink);letter-spacing:-.04em;}
.poster-sub{font-family:'Montserrat',sans-serif;font-size:.75rem;font-weight:300;font-style:italic;color:var(--grey);letter-spacing:.2em;margin-top:.8rem;}
.ok-computer{font-family:'Montserrat',sans-serif;font-size:4rem;font-weight:900;color:var(--border);line-height:1;letter-spacing:-.05em;text-align:right;}

/* Controls */
.controls{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.75rem;align-items:center;}
.ctrl-label{font-family:'Montserrat',sans-serif;font-size:.65rem;letter-spacing:.2em;color:var(--grey);text-transform:uppercase;}
.vibe-btn{background:transparent;border:1px solid var(--border);color:var(--grey);font-family:'Montserrat',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.12em;padding:.45rem 1rem;cursor:pointer;text-transform:uppercase;transition:all .2s;}
.vibe-btn:hover{border-color:var(--blue);color:var(--blue);}
.vibe-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.gen-btn{background:var(--ink);border:none;color:var(--bg);font-family:'Montserrat',sans-serif;font-size:.85rem;font-weight:700;letter-spacing:.15em;padding:.65rem 2rem;cursor:pointer;text-transform:uppercase;transition:background .2s;margin-left:auto;}
.gen-btn:hover{background:var(--blue);}

.variant-counter{font-family:'Montserrat',sans-serif;font-size:.6rem;color:var(--grey);margin-bottom:2.5rem;letter-spacing:.1em;text-transform:uppercase;}
.variant-counter span{color:var(--blue);font-weight:700;}

/* Program */
.setlist-wrap{display:none;animation:fadeUp .5s ease forwards;}
.setlist-wrap.visible{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.program{background:#fff;border:1px solid var(--border);box-shadow:4px 4px 0 var(--ink);}

.program-cover{background:var(--ink);color:#fff;padding:2.5rem 3rem;display:grid;grid-template-columns:1fr auto;gap:1.5rem;align-items:start;}
.prog-band{font-family:'Montserrat',sans-serif;font-size:clamp(1.4rem,3.5vw,2.2rem);font-weight:900;letter-spacing:-.02em;line-height:1;}
.prog-tour{font-family:'Montserrat',sans-serif;font-size:.85rem;font-weight:300;font-style:italic;color:#aaa;margin-top:.4rem;letter-spacing:.05em;}
.prog-meta{text-align:right;font-size:.62rem;color:#888;letter-spacing:.08em;line-height:2;text-transform:uppercase;}
.prog-meta strong{color:#fff;display:block;font-size:.78rem;}

.prog-body{padding:2.5rem 3rem;}
.prog-section{margin-bottom:2rem;}
.prog-section-head{display:flex;align-items:center;gap:1rem;margin-bottom:.8rem;}
.prog-section-num{font-family:'Montserrat',sans-serif;font-size:1.8rem;font-weight:900;color:var(--border);line-height:1;min-width:2rem;}
.prog-section-title{font-family:'Montserrat',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.3em;color:var(--blue);text-transform:uppercase;}

.prog-track{display:grid;grid-template-columns:28px 1fr auto;gap:.8rem;align-items:baseline;padding:.55rem 0;border-bottom:1px solid var(--surface);}
.prog-track:last-child{border-bottom:none;}
.prog-track:hover{background:var(--surface);margin:0 -.5rem;padding:.55rem .5rem;}
.prog-num{font-family:'Montserrat',sans-serif;font-size:.72rem;font-weight:300;color:var(--border);text-align:right;}
.prog-name{font-family:'Montserrat',sans-serif;font-size:.92rem;font-weight:700;color:var(--ink);line-height:1.1;}
.prog-album{font-size:.57rem;color:var(--grey);letter-spacing:.05em;margin-top:.12rem;font-style:italic;}
.prog-dur{font-size:.63rem;color:var(--grey);white-space:nowrap;font-variant-numeric:tabular-nums;}

.prog-encore-marker{text-align:center;padding:.8rem 0 .4rem;font-family:'Montserrat',sans-serif;font-size:.6rem;letter-spacing:.5em;color:var(--blue);text-transform:uppercase;border-top:1px dashed var(--border);margin-bottom:.8rem;}

.prog-footer{background:var(--surface);border-top:1px solid var(--border);padding:1.5rem 3rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;}
.prog-footer-stat{font-family:'Montserrat',sans-serif;font-size:.62rem;color:var(--grey);letter-spacing:.1em;text-transform:uppercase;}
.prog-footer-stat strong{color:var(--ink);font-size:.95rem;display:block;}

.sp-add-btn{display:none;align-items:center;gap:.5rem;background:var(--sp);border:none;color:#000;font-family:'Montserrat',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.12em;padding:.55rem 1.4rem;cursor:pointer;text-transform:uppercase;transition:background .2s;}
.sp-add-btn.show{display:flex;}
.sp-add-btn:hover{background:var(--sp-dark);}
.sp-add-btn:disabled{opacity:.5;cursor:not-allowed;}
.sp-feedback{font-size:.63rem;padding:.45rem .7rem;border:1px solid transparent;display:none;margin-top:.5rem;}
.sp-feedback.show{display:block;}
.sp-feedback.ok{border-color:var(--sp);color:var(--sp);}
.sp-feedback.err{border-color:var(--red);color:var(--red);}
.sp-feedback a{color:inherit;}
.shuffle-note{font-size:.58rem;color:var(--border);text-align:right;margin-top:1.5rem;letter-spacing:.1em;text-transform:uppercase;}

@media(max-width:600px){
  .poster-header{grid-template-columns:1fr;}.ok-computer{display:none;}
  .program-cover{grid-template-columns:1fr;padding:1.5rem;}.prog-meta{text-align:left;}
  .prog-body,.prog-footer{padding:1.5rem;}
  .gen-btn{margin-left:0;width:100%;}
  main{padding:2rem 1rem 4rem;}
}
</style>
</head>
<body>

<div class="sp-bar">
  <span class="sp-bar-label">Spotify</span>

      <div class="poster-sub">Every show is different.</div>
    </div>
    <div class="ok-computer">OK</div>

  <div class="controls">
    <span class="ctrl-label">Type:</span>

    <button class="vibe-btn" data-vibe="experimental">Experimenteel</button>
    <button class="vibe-btn" data-vibe="emotional">Emotioneel</button>
    <button class="vibe-btn" data-vibe="complete">Complete Career</button>
    <button class="gen-btn" onclick="generateSetlist()">▶ Genereer Setlist</button>
  </div>
  <div class="variant-counter" id="variantCounter">&nbsp;</div>

  <div class="setlist-wrap" id="setlistWrap"></div>
</main>

<script>
// ── Spotify PKCE ──────────────────────────────────────────────────────────
const SP=(()=>{
  const P='rc2_',k=n=>P+n,SCOPES='playlist-modify-public playlist-modify-private';
  async function rand32(){const a=new Uint8Array(32);crypto.getRandomValues(a);return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');}
  async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');}
  function redirectUri(){return window.location.origin+window.location.pathname;}
  async function login(cid){localStorage.setItem(k('cid'),cid);const v=await rand32();localStorage.setItem(k('v'),v);const ch=await sha256(v);window.location='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:cid,response_type:'code',redirect_uri:redirectUri(),scope:SCOPES,code_challenge_method:'S256',code_challenge:ch});}
  async function _save(r){const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.error||`HTTP ${r.status}`);localStorage.setItem(k('token'),d.access_token);localStorage.setItem(k('exp'),Date.now()+(d.expires_in-60)*1000);if(d.refresh_token)localStorage.setItem(k('refresh'),d.refresh_token);}
  async function _exchange(code){await _save(await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:redirectUri(),client_id:localStorage.getItem(k('cid')),code_verifier:localStorage.getItem(k('v'))})}))}
  async function _refresh(){const rt=localStorage.getItem(k('refresh'));if(!rt)throw new Error('Sessie verlopen.');await _save(await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'refresh_token',refresh_token:rt,client_id:localStorage.getItem(k('cid'))})}))}
  async function token(){const t=localStorage.getItem(k('token')),e=parseInt(localStorage.getItem(k('exp'))||'0');if(t&&Date.now()<e)return t;await _refresh();return localStorage.getItem(k('token'));}
  async function api(ep,opts={},attempt=0){const tk=await token();const r=await fetch('https://api.spotify.com/v1'+ep,{...opts,headers:{'Authorization':'Bearer '+tk,'Content-Type':'application/json',...(opts.headers||{})}});if(r.status===429){if(attempt>=4)throw new Error('Rate limit.');await new Promise(res=>setTimeout(res,parseInt(r.headers.get('Retry-After')||'1')*1000*Math.pow(2,attempt)));return api(ep,opts,attempt+1);}if(r.status===204)return{};const d=await r.json();if(!r.ok){const msg=d?.error?.message||`HTTP ${r.status}`;if(r.status===401)throw new Error('Sessie verlopen.');if(r.status===403)throw new Error('Toegang geweigerd: '+msg);throw new Error(`Spotify fout ${r.status}: ${msg}`);}return d;}
  async function handleCallback(){const p=new URLSearchParams(location.search);if(p.get('error'))throw new Error('Login geweigerd: '+p.get('error'));if(!p.get('code'))return false;await _exchange(p.get('code'));history.replaceState({},'',location.pathname);return true;}
  function logout(){['token','exp','refresh','v'].forEach(n=>localStorage.removeItem(k(n)));}
  const isConnected=()=>!!localStorage.getItem(k('token'));
  const clientId=()=>localStorage.getItem(k('cid'))||'';
  async function searchTrack(title,artist){const q=encodeURIComponent(`track:${title} artist:${artist}`);const d=await api(`/search?q=${q}&type=track&limit=1`);return d.tracks?.items?.[0]?.uri??null;}
  async function createPlaylist(name,desc){return api('/me/playlists',{method:'POST',body:JSON.stringify({name,description:desc,public:false})});}
  async function addItems(id,uris){for(let i=0;i<uris.length;i+=100)await api(`/playlists/${id}/items`,{method:'POST',body:JSON.stringify({uris:uris.slice(i,i+100)})});}
  return{login,handleCallback,logout,isConnected,clientId,redirectUri,searchTrack,createPlaylist,addItems};
})();

// ── UI ────────────────────────────────────────────────────────────────────
document.querySelectorAll('.vibe-btn').forEach(b=>
  b.addEventListener('click',()=>{
    document.querySelectorAll('.vibe-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    updateCounter(b.dataset.vibe,0);
  })
);

function updateSpUI(){
  const ok=SP.isConnected();
  document.getElementById('spLoginArea').style.display=ok?'none':'flex';
  const ca=document.getElementById('spConnectedArea');ca.style.display=ok?'flex':'none';
  document.getElementById('spHint').innerHTML=ok?'':
    `Redirect URI voor Spotify Dashboard: <code>${SP.redirectUri()}</code>`;
  const btn=document.getElementById('spAddBtn');if(btn)btn.classList.toggle('show',ok);
}
function doLogin(){const cid=document.getElementById('cidInput').value.trim();if(!cid){alert('Vul je Client ID in.');return;}SP.login(cid).catch(e=>alert(e.message));}
function doLogout(){SP.logout();updateSpUI();}

const lastIdx={};

function updateCounter(vibe,current){
  const total=SETLISTS[vibe].length;
  const el=document.getElementById('variantCounter');
  el.innerHTML=total>1
    ?`Variant <span>${current+1}</span> van <span>${total}</span> — druk opnieuw voor een andere setlist`
    :'&nbsp;';
}

function generateSetlist(){
  const vibe=document.querySelector('.vibe-btn.active').dataset.vibe;
  const pool=SETLISTS[vibe];
  const idx=(((lastIdx[vibe]??-1)+1)%pool.length);
  lastIdx[vibe]=idx;
  updateCounter(vibe,idx);
  renderSetlist(pool[idx]);
}

function renderSetlist(set){
  window.__currentSet__=set;
  const allTracks=set.sections.flatMap(s=>s.tracks);
  const totalSecs=allTracks.reduce((a,t)=>{const[m,s]=(t.d||'4:00').split(':').map(Number);return a+m*60+(s||0);},0);
  const totalMins=Math.floor(totalSecs/60);
  let num=0,secNum=0;

  const sectionsHtml=set.sections.map(sec=>{
    secNum++;
    return `
      ${sec.encore?'<div class="prog-encore-marker">— Encore —</div>':''}
      <div class="prog-section">
        <div class="prog-section-head">
          <div class="prog-section-num">0${secNum}</div>
          <div class="prog-section-title">${sec.title}</div>
        </div>
        ${sec.tracks.map(tr=>{num++;return `
          <div class="prog-track">
            <div class="prog-num">${num}</div>
            <div>
              <div class="prog-name">${esc(tr.t)}</div>
              <div class="prog-album">${esc(tr.a)}</div>
            </div>
            <div class="prog-dur">${tr.d}</div>
          </div>`;}).join('')}
      </div>`;
  }).join('');

  const spShow=SP.isConnected()?'show':'';
  const wrap=document.getElementById('setlistWrap');
  wrap.innerHTML=`
    <div class="program">
      <div class="program-cover">
        <div>
          <div class="prog-band">Radiohead</div>
          <div class="prog-tour">${esc(set.name)}</div>
        </div>
        <div class="prog-meta">
          <strong>${esc(set.venue)}</strong>
          ${esc(set.date)}<br>
          ${allTracks.length} nummers · ${totalMins} min
        </div>
      </div>
      <div class="prog-body">${sectionsHtml}</div>
      <div class="prog-footer">
        <div style="display:flex;gap:2rem;">
          <div class="prog-footer-stat"><strong>${allTracks.length}</strong>Nummers</div>
          <div class="prog-footer-stat"><strong>${totalMins} min</strong>Speeltijd</div>
        </div>
        <div>
          <button class="sp-add-btn ${spShow}" id="spAddBtn" onclick="addToSpotify()">▶ Zet op Spotify</button>
          <div class="sp-feedback" id="spFeedback"></div>
        </div>
      </div>
    </div>
    <div class="shuffle-note">Druk opnieuw op "Genereer Setlist" voor de volgende variant</div>`;

  wrap.classList.remove('visible');
  void wrap.offsetWidth;
  wrap.classList.add('visible');
  wrap.scrollIntoView({behavior:'smooth',block:'start'});
}

async function addToSpotify(){
  const btn=document.getElementById('spAddBtn'),fb=document.getElementById('spFeedback');
  btn.disabled=true;btn.textContent='Bezig…';fb.className='sp-feedback';
  try{
    const set=window.__currentSet__;
    const tracks=set.sections.flatMap(s=>s.tracks);
    const pl=await SP.createPlaylist('Radiohead — '+set.name,'Setlist gegenereerd via Radiohead Concert Generator');
    const uris=[];
    for(const t of tracks){const uri=await SP.searchTrack(t.t,'Radiohead');if(uri)uris.push(uri);}
    await SP.addItems(pl.id,uris);
    const url=pl.external_urls?.spotify||'#';
    fb.innerHTML=`✓ ${uris.length}/${tracks.length} nummers gevonden. <a href="${url}" target="_blank" rel="noopener">Open in Spotify ↗</a>`;
    fb.className='sp-feedback show ok';
  }catch(e){fb.textContent='✗ '+e.message;fb.className='sp-feedback show err';}
  btn.disabled=false;btn.textContent='▶ Zet op Spotify';
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

(async()=>{
  const cid=SP.clientId();if(cid)document.getElementById('cidInput').value=cid;
  try{await SP.handleCallback();}catch(e){alert(e.message);}
  updateSpUI();
  updateCounter('classic',0);
})();
</script>
